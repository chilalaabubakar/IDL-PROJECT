# Our 576-atom silica glasses (scripts/silica/make_glasses.py; docs/SILICA_3D_PLAN.md 2.1-2.2).
#   python scripts/silica/check_potential.py --config configs/silica/md.yaml   # first, ~10 min
#   python scripts/silica/make_glasses.py --config configs/silica/md.yaml workers=64
#   python scripts/silica/make_glasses.py --config configs/silica/md.yaml dry=true   # 2 min test
name: sio2_576
out_dir: data/sio2_576
defects: configs/silica/defects.yaml
protocol:                      # src/glassdiff/silica/md.py SilicaProtocol (DM2 Methods)
  n_sio2: 192                  # 576 atoms, box ~20.7 A
  rho_init: 1.5                # g/cm^3, random placement
  min_dist: 1.8                # A
  dt: 1.0                      # fs
  t_low: 300.0
  t_melt: 5000.0
  equil_nvt_ps: 50.0
  equil_npt_ps: 50.0
  melt_ps: 50.0
  final_ps: 100.0
  pressure: 1.0                # atm
  tdamp: 100.0                 # fs
  pdamp: 1000.0                # fs
  alpha: 0.25                  # 1/A, DSF damping
  cutoff: 8.0                  # A
gates:                         # rejected glasses are replaced by the next seeds
  density_range: [2.0, 2.4]
  min_si_cn4: 0.95
  min_dist: 1.2
# Glasses per split and cooling rate (K/ps). Seeds are seed0 + i, disjoint across groups.
# Cost on one core: 0.24 h per glass at 100 K/ps, 0.58 h at 10, 4.0 h at 1.
splits:
  train:
    - {rate: 10.0, n: 400, seed0: 100000}
    - {rate: 100.0, n: 200, seed0: 200000}
  val:
    - {rate: 10.0, n: 50, seed0: 300000}
  test:
    - {rate: 10.0, n: 100, seed0: 400000}
    - {rate: 1.0, n: 50, seed0: 500000}
# Stretch: size transfer (1,536 atoms); run with only=transfer when time allows.
extra_splits:
  transfer:
    - {rate: 1.0, n: 10, seed0: 600000, n_sio2: 512}
check:                         # scripts/silica/check_potential.py
  glasses: data/sio2_dm2/test.npz
  n_glasses: 2
  ps: 20.0
  max_density_change: 0.03
  max_cn4_change: 0.02
  out: results/silica/potential_check.json
dry_protocol:                  # dry=true: 4 tiny fast glasses into <out_dir>_dry
  n_sio2: 64
  rate: 1000.0
  equil_nvt_ps: 1.0
  equil_npt_ps: 1.0
  melt_ps: 2.0
  final_ps: 2.0
