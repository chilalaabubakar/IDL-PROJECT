# Unconditional baseline on DM2's 3,000-atom glasses (as train_cond_dm2.yaml, no labels or
# held atoms; still noise- and rate-aware).
#   python scripts/silica/train.py --config configs/silica/train_uncond_dm2.yaml run_dir=runs/silica/uncond_dm2_s0
name: silica_uncond_dm2
seed: 0
data: data/sio2_dm2
conditional: false
model:
  n_species: 2
  node_dim: 8
  cond_dim: 16
  hidden_irreps: "64x0e + 32x1e"
  edge_irreps: "4x0e + 4x1e + 2x2e"
  n_convs: 3
  cutoff: 5.0
  n_basis: 16
  radial_neurons: [16, 64]
  num_neighbors: 12.0
  sigma_aware: true
  rate_aware: true
noise:
  sigma_min: 1.0e-3
  sigma_max: 1.0
optim:
  lr: 2.0e-4
  weight_decay: 0.0
  batch_size: 4
  accumulate: 2
  n_updates: 15000
  grad_clip: 1.0
  ema: 0.999
val_sigmas: [0.05, 0.2, 0.5, 1.0]
val_batches: 4
log_every: 50
val_every: 500
ckpt_every: 500
