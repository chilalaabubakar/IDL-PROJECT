# Point-defect dataset (docs/POINT_DEFECTS.md): scripts/make_point_defects.py
name: ka2d_256_point_defects
source: data/ka2d_256            # defect-free originals (inherent structures), same splits
out_dir: data/ka2d_256_point_defects
seed: 0
workers: null                    # null = every CPU core
sites_per_glass:                 # one defect per example, at a random site
  train: 8                       # 800 glasses -> 6,400 examples per kind
  val: 2
  test: 2
kinds: [vacancy, interstitial, frenkel, antisite]
interstitial_species: 1          # B, the small species
interstitial_search: 2.0         # sigma, largest gap within this of a random point
frenkel_hop: [1.2, 3.0]          # sigma, the atom moves to the largest gap this far away
vacancy_insert_search: 1.0       # sigma, repair input: where the missing atom is put back
shell_factor: 1.4                # first shell r < 1.4 sigma_ab (the dataset's neighbour rule)
recombined_tol: 0.3              # a Frenkel atom back within this of its site is no defect
min_pair_dist: 0.56              # dataset quality gate
ftol: 1.0e-8                     # LAMMPS minimize, as the dataset
