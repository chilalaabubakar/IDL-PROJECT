# Repair model for point defects (docs/POINT_DEFECTS.md): scripts/train_point_defects.py
name: pd_heal
task: heal
seed: 0
data: data/ka2d_256_point_defects
model: configs/model/egnn.yaml
# start from the trained unconditional denoiser (same architecture); null to train from scratch
init_from: results/kaggle_20261006-0454Z/training/egnn_uncond_smax1/ema.pt
kind_probs: {vacancy: 0.25, interstitial: 0.25, frenkel: 0.25, antisite: 0.25}
p_clean: 0.2                 # fraction of batches that are defect-free glasses (DM2's loss)
noise:
  sigma_min: 1.0e-3
  sigma_max: 0.5             # covers the starting noise of repair (0.2-0.35)
optim:
  lr: 2.0e-4
  weight_decay: 0.0
  batch_size: 16
  n_updates: 20000           # about 1.5 h on a T4
  grad_clip: 1.0
  ema: 0.999
val_sigma: [0.001, 0.1, 0.3]
n_val: 200
log_every: 100
val_every: 1000
ckpt_every: 2000
