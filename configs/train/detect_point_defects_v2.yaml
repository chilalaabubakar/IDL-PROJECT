# Point-defect finder, longer run (docs/POINT_DEFECTS.md): scripts/train_point_defects.py
# The first finder (detect_point_defects.yaml, 20,000 updates) had plateaued for vacancies and
# Frenkel pairs but was still improving for interstitials and antisites
# (results/point_defects_finder_20261109/). This continues it for 40,000 updates at half the
# learning rate; same data, model and class weights. Evaluate with --calibrate.
name: pd_detect_v2
task: detect
seed: 1
data: data/ka2d_256_point_defects
model:
  name: egnn_classifier
  hidden: 128
  n_layers: 4
  cutoff: 2.5
  k_max: 64
  n_classes: 5
init_from: results/kaggle_pd_20261107-2024Z/training/pd_detect/ema.pt   # the first finder
kind_probs: {vacancy: 0.25, interstitial: 0.25, frenkel: 0.25, antisite: 0.25}
p_clean: 0.2
class_weight_power: 0.5
optim:
  lr: 1.0e-4
  weight_decay: 0.0
  batch_size: 16
  n_updates: 40000            # about 2.5 h on a T4
  grad_clip: 1.0
  ema: 0.999
n_val: 200
log_every: 100
val_every: 2000
ckpt_every: 2000
