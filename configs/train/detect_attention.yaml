# Point-defect finder, other architectures (docs/POINT_DEFECTS.md, "Other finders"):
# a transformer over all atoms with the distances as attention bias (src/glassdiff/models/attention.py).
# Everything but the model is the recipe of detect_point_defects.yaml, from random starting
# weights and for 20,000 updates, so that the three finders are compared on equal terms:
#   detect_egnn_scratch.yaml, detect_attention.yaml, detect_cnn.yaml
# The finder of the report (from the denoiser, detect_point_defects.yaml) is the reference.
name: pd_detect_attention
task: detect
seed: 0
data: data/ka2d_256_point_defects
model:
  name: atom_transformer
  hidden: 128
  n_layers: 4
  n_heads: 8
  ffn: 256
  n_classes: 5               # 0.58 M parameters
init_from: null              # random starting weights
kind_probs: {vacancy: 0.25, interstitial: 0.25, frenkel: 0.25, antisite: 0.25}
p_clean: 0.2
class_weight_power: 0.5
optim:
  lr: 2.0e-4
  weight_decay: 0.0
  batch_size: 16
  n_updates: 20000
  grad_clip: 1.0
  ema: 0.999
  warmup: 1000               # learning rate rises over the first 1,000 updates (usual for transformers)
n_val: 200
log_every: 100
val_every: 1000
ckpt_every: 1000
log_steps: true
