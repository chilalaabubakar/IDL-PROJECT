name: pd_heal
task: heal
seed: 0
data: data/ka2d_256_point_defects
model: configs/model/egnn.yaml
init_from: results/kaggle_20261006-0454Z/training/egnn_uncond_smax1/ema.pt
kind_probs:
  vacancy: 0.25
  interstitial: 0.25
  frenkel: 0.25
  antisite: 0.25
p_clean: 0.2
noise:
  sigma_min: 0.001
  sigma_max: 0.5
optim:
  lr: 0.0002
  weight_decay: 0.0
  batch_size: 16
  n_updates: 20000
  grad_clip: 1.0
  ema: 0.999
val_sigma:
- 0.001
- 0.1
- 0.3
n_val: 200
log_every: 100
val_every: 1000
ckpt_every: 2000
max_minutes: 511
threads: 2
runs_root: /kaggle/working/pd/runs
resolved_model:
  name: egnn_pbc
  hidden: 128
  n_layers: 4
  cutoff: 2.5
  k_max: 64
  sigma_aware: true
